version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: studio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-studio_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-studio_password}
      POSTGRES_DB: ${DB_DATABASE:-studio_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-studio_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - studio-network

  # pgAdmin - Interfaz web para administrar PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: studio-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - studio-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  studio-network:
    driver: bridge
