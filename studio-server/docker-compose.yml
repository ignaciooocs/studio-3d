version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: studio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-studio_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-studio_password}
      POSTGRES_DB: ${DB_DATABASE:-studio_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-studio_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - studio-network

volumes:
  postgres_data:
    driver: local

networks:
  studio-network:
    driver: bridge
